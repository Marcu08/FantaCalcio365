name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    name: Build + test app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

  sql-tests:
    name: Migrations + test SQL (Supabase locale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack (Docker incluso nel runner)
        run: supabase start

      - name: Applica migrations e seed di test
        run: supabase db reset

      - name: Test motore di scoring (FASE 1)
        run: supabase db query --local --file supabase/tests/scoring_tests.sql

      - name: Test fase 2 (cache, override, idempotenza, RLS)
        run: supabase db query --local --file supabase/tests/phase2_tests.sql

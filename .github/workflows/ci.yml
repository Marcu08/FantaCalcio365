name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    name: Build + test app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

  sql-tests:
    name: Migrations + test SQL (Supabase locale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack (Docker incluso nel runner)
        run: supabase start

      - name: Applica migrations e seed di test
        run: supabase db reset

      - name: Test motore di scoring (FASE 1)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/scoring_tests.sql

      - name: Test fase 2 (cache, override, idempotenza, RLS)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/phase2_tests.sql

      - name: Test RLS pronostici + spareggi classifica (FASE 3)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests.sql

  migration-on-populated:
    name: Migration 0008 su database popolato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Esclude temporaneamente la 0008 (simula DB pre-FASE 2)
        run: mv supabase/migrations/0008_cache_and_audit.sql /tmp/0008.sql

      - name: Avvia stack locale (applica 0001-0007)
        run: supabase start

      - name: Inserisce dati di esempio realistici
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/populated_seed.sql

      - name: Conteggi pre-0008
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atc \
            "select 'matches='||count(*) from matches;
             select 'players='||count(*) from players;
             select 'predictions='||count(*) from predictions;
             select 'scores='||count(*) from scores;
             select 'score40='||total from scores limit 1;" > /tmp/counts_before.txt
          cat /tmp/counts_before.txt

      - name: Applica la 0008 su database popolato
        run: mv /tmp/0008.sql supabase/migrations/0008_cache_and_audit.sql && psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/0008_cache_and_audit.sql

      - name: Conteggi post-0008 e confronto
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atc \
            "select 'matches='||count(*) from matches;
             select 'players='||count(*) from players;
             select 'predictions='||count(*) from predictions;
             select 'scores='||count(*) from scores;
             select 'score40='||total from scores limit 1;" > /tmp/counts_after.txt
          cat /tmp/counts_after.txt
          diff /tmp/counts_before.txt /tmp/counts_after.txt
          echo "OK: nessun dato perso, punteggi invariati dopo la 0008"

  deno-functions:
    name: Test Edge Functions (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.0.0

      - name: Test Edge Functions
        run: deno test --allow-all --import-map supabase/functions/tests/import_map.json supabase/functions/tests/
